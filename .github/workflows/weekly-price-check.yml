name: Weekly supermarket price check
on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 7 * * 1'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: Run scheduled collection
        if: github.event_name == 'schedule'
        env:
          POSTCODE: ${{ secrets.POSTCODE }}
          HOUSE_NUMBER: ${{ secrets.HOUSE_NUMBER }}
          CITY: ${{ secrets.CITY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m src.main --send-email
      - name: Run manually
        if: github.event_name == 'workflow_dispatch'
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m src.main --manual --send-email
      - uses: actions/upload-artifact@v4
        with:
          name: supermarket-price-report
          path: |
            reports/
            data/latest.json
            data/history.csv
